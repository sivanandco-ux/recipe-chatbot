<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sivan Spices — Recipe Bot</title>
<style>
  :root {
    --purple: #A855C8;
    --navy: #2D1B69;
    --cream: #FBF7F0;
    --cream-deep: #F3EADB;
    --ink: #2A2438;
    --ink-soft: #6B6480;
    --bubble-bot: #FFFFFF;
    --bubble-user: #A855C8;
    --line: #E7DECF;
    --shadow: 0 1px 2px rgba(45,27,105,0.06), 0 8px 24px rgba(45,27,105,0.06);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 460px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--cream);
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 18px;
    background: var(--navy);
    color: #fff;
    flex-shrink: 0;
  }
  .header img {
    height: 30px;
    width: auto;
    max-width: 150px;
    object-fit: contain;
    display: block;
  }
  .header .title { display: flex; flex-direction: column; line-height: 1.15; }
  .header .title strong { font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
  .header .title span { font-size: 11.5px; color: #C9BCEC; }
  .header .test-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.7px;
    color: var(--navy);
    background: #F4C84A;
    padding: 4px 9px;
    border-radius: 999px;
  }

  /* ---------- Chat scroll ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .row { display: flex; max-width: 100%; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }

  .bubble {
    max-width: 84%;
    padding: 11px 15px;
    font-size: 15px;
    line-height: 1.5;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    word-wrap: break-word;
    animation: pop .26s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--ink);
    border-bottom-left-radius: 6px;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .bubble p + p { margin-top: 8px; }
  .bubble strong { font-weight: 650; }

  /* ---------- Sivan product card (the hero CTA) ---------- */
  .product-card {
    margin-top: 10px;
    border: 1.5px solid var(--purple);
    border-radius: 14px;
    padding: 12px 13px;
    background: linear-gradient(180deg, #FBF4FF 0%, #FFFFFF 100%);
  }
  .product-card .pc-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 6px;
  }
  .product-card .pc-name { font-size: 14.5px; font-weight: 650; color: var(--navy); margin-bottom: 10px; }
  .product-card a.cta {
    display: inline-block;
    background: var(--purple);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 650;
    padding: 8px 14px;
    border-radius: 999px;
  }
  .product-card a.cta:active { transform: translateY(1px); }

  /* ---------- Copy list ---------- */
  .copy-block {
    margin-top: 10px;
    background: var(--cream-deep);
    border-radius: 14px;
    padding: 12px 13px;
  }
  .copy-block .cb-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 7px;
  }
  .copy-block .cb-items { font-size: 14px; line-height: 1.55; color: var(--ink); margin-bottom: 11px; }
  .copy-block button {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--navy); color: #fff; border: none;
    font-size: 12.5px; font-weight: 650; padding: 8px 14px;
    border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .copy-block button:active { transform: translateY(1px); }
  .copy-block button.copied { background: #3E9D6B; }

  /* ---------- Ingredients (with quantities) ---------- */
  .ingredients-block {
    margin-top: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .ingredients-block .ib-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--navy); margin-bottom: 9px;
  }
  .ingredients-block .ib-list { list-style: none; }
  .ingredients-block .ib-list li {
    display: flex; gap: 10px; align-items: baseline;
    padding: 4px 0; font-size: 14px; line-height: 1.4;
    border-bottom: 1px solid #F3ECDF;
  }
  .ingredients-block .ib-list li:last-child { border-bottom: none; }
  .ingredients-block .ing-q {
    flex-shrink: 0; min-width: 62px;
    font-weight: 650; color: var(--purple); font-variant-numeric: tabular-nums;
  }
  .ingredients-block .ing-n { color: var(--ink); }

  /* ---------- Full recipe panel ---------- */
  .recipe-panel {
    background: #fff;
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin: 2px 0;
    animation: pop .3s ease;
  }
  .recipe-panel .rp-head {
    background: var(--navy);
    color: #fff;
    padding: 14px 16px 13px;
  }
  .recipe-panel .rp-head h2 {
    font-size: 18px; font-weight: 700; letter-spacing: 0.2px; margin-bottom: 3px;
  }
  .recipe-panel .rp-head p { font-size: 12.5px; line-height: 1.45; color: #CFC2EF; }
  .recipe-panel .rp-body { padding: 14px 16px 16px; }
  .recipe-panel .rp-section-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--purple); margin: 0 0 9px;
  }
  .recipe-panel .rp-steps { list-style: none; counter-reset: step; }
  .recipe-panel .rp-steps li {
    position: relative;
    padding: 0 0 13px 34px;
    font-size: 14.5px; line-height: 1.5; color: var(--ink);
    counter-increment: step;
  }
  .recipe-panel .rp-steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: -1px;
    width: 23px; height: 23px;
    background: var(--cream-deep); color: var(--navy);
    border-radius: 50%; font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }
  .recipe-panel .rp-steps li:last-child { padding-bottom: 0; }
  .recipe-panel .rp-divider { height: 1px; background: var(--line); margin: 4px 0 14px; }

  /* ---------- Voice player ---------- */
  .voice-player {
    background: linear-gradient(180deg, #FBF4FF 0%, #F6ECFF 100%);
    border: 1.5px solid var(--purple);
    border-radius: 14px;
    padding: 13px 14px 14px;
  }
  .voice-player .vp-row { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .voice-player .vp-play {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--purple); color: #fff; font-size: 15px; cursor: pointer;
    display: grid; place-items: center; font-family: inherit;
  }
  .voice-player .vp-play:active { transform: scale(.93); }
  .voice-player .vp-meta { display: flex; flex-direction: column; gap: 2px; }
  .voice-player .vp-name { font-size: 13.5px; font-weight: 650; color: var(--navy); }
  .voice-player .vp-time { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .voice-player .vp-scrub {
    width: 100%; height: 5px; -webkit-appearance: none; appearance: none;
    background: #E2CCF0; border-radius: 999px; outline: none; cursor: pointer;
  }
  .voice-player .vp-scrub::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%; background: var(--purple);
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(45,27,105,.3);
  }
  .voice-player .vp-scrub::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%; background: var(--purple);
    border: 2px solid #fff;
  }
  .voice-missing {
    background: var(--cream-deep); border-radius: 12px; padding: 11px 13px;
    font-size: 13px; color: var(--ink-soft); line-height: 1.45;
  }

  /* ---------- Rating popup ---------- */
  .rating-overlay {
    position: absolute; inset: 0; z-index: 50;
    background: rgba(45,27,105,0.28);
    display: grid; place-items: center; padding: 24px;
    opacity: 0; transition: opacity .22s ease;
    backdrop-filter: blur(2px);
  }
  .rating-overlay.show { opacity: 1; }
  .rating-card {
    position: relative;
    background: #fff; border-radius: 20px;
    width: 100%; max-width: 320px;
    padding: 26px 22px 22px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(45,27,105,0.28);
    transform: translateY(8px) scale(.98);
    transition: transform .22s ease;
  }
  .rating-overlay.show .rating-card { transform: none; }
  .rating-close {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; font-size: 22px; line-height: 1;
    color: var(--ink-soft); cursor: pointer; padding: 4px;
  }
  .rating-mix-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 2px; }
  .rating-mix-name { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 16px; line-height: 1.3; }
  .rating-stars { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .rating-stars .star {
    background: none; border: none; cursor: pointer;
    font-size: 32px; line-height: 1; color: #E2D8C7;
    transition: transform .12s ease, color .12s ease; padding: 2px;
  }
  .rating-stars .star.lit { color: #F4B63E; }
  .rating-stars .star:hover { transform: scale(1.15); }
  .rating-hint { font-size: 13px; color: var(--ink-soft); min-height: 18px; font-weight: 600; }
  .rating-thanks { font-size: 15px; color: var(--navy); line-height: 1.5; padding: 14px 6px; font-weight: 600; }

  /* ---------- Rate-mix button (persistent, in cooking panel) ---------- */
  .rate-mix-btn {
    margin-top: 16px; width: 100%;
    background: #fff; border: 1.5px solid var(--purple); color: var(--purple);
    font-family: inherit; font-size: 13.5px; font-weight: 650;
    padding: 11px 14px; border-radius: 12px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .rate-mix-btn:hover { background: var(--purple); color: #fff; }
  .rate-mix-btn:active { transform: translateY(1px); }

  /* ---------- Cooking step card (mode 3) ---------- */
  .step-card { }

  /* ---------- Quick-reply chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 2px; }
  .chip {
    background: #fff; border: 1.5px solid var(--line);
    color: var(--navy); font-size: 13.5px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    font-family: inherit; transition: border-color .15s, background .15s;
    animation: pop .26s ease;
  }
  .chip:hover { border-color: var(--purple); background: #FBF4FF; }
  .chip:active { transform: translateY(1px); }

  /* ---------- Composer ---------- */
  .composer {
    flex-shrink: 0;
    display: flex; gap: 9px; align-items: center;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--cream);
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1; border: 1.5px solid var(--line); background: #fff;
    border-radius: 999px; padding: 12px 16px; font-size: 15px;
    font-family: inherit; color: var(--ink); outline: none;
  }
  .composer input:focus { border-color: var(--purple); }
  .composer button {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--purple); color: #fff; cursor: pointer;
    font-size: 18px; display: grid; place-items: center; flex-shrink: 0;
  }
  .composer button:active { transform: scale(.94); }

  /* ---------- Typing indicator ---------- */
  .typing { display: inline-flex; gap: 4px; padding: 3px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft);
    opacity: .4; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: .9; } }

  .chat::-webkit-scrollbar { width: 0; }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .chip { animation: none; }
    .chat { scroll-behavior: auto; }
  }
</style>
</head>

  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(row); scrollDown();
}

function addBot(html){
  const row = document.createElement('div');
  row.className = 'row bot';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  row.appendChild(b);
  chat.appendChild(row); scrollDown();
  return b;
}

function typing(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typing';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(row); scrollDown();
}
function stopTyping(){ const t = document.getElementById('typing'); if(t) t.remove(); }

/* Bot speaks after a short, human pause */
function botSay(html, opts={}){
  typing();
  setTimeout(()=>{ stopTyping(); const b = addBot(html); if(opts.after) opts.after(b); }, opts.delay || 620);
}

function setChips(list){
  chipsBar.innerHTML = '';
  list.forEach(label=>{
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = label;
    c.onclick = ()=>{ handleUserMessage(label); };
    chipsBar.appendChild(c);
  });
}
function clearChips(){ chipsBar.innerHTML = ''; }

function escapeHtml(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   RECIPE VIEW — one screen: CTA, ingredients w/ quantities,
   names-only copy list, audio player, steps, rating button
   ============================================================ */
function showRecipe(key){
  const r = RECIPES[key];
  state.mode = 'recipe'; state.recipe = key;

  // 1) Sivan mix — hero CTA
  const productCard = `
    <div class="product-card">
      <div class="pc-label">${r.mix.label}</div>
      <div class="pc-name">${r.mix.name}</div>
      <a class="cta" href="${r.mix.url}" target="_blank" rel="noopener">Get it on sivanspices.com →</a>
    </div>`;

  // 2) Full ingredient list WITH quantities
  const ingHtml = r.ingredients.map(i=>
    `<li><span class="ing-q">${i.q || ""}</span><span class="ing-n">${i.n}</span></li>`
  ).join("");
  const ingredientsBlock = `
    <div class="ingredients-block">
      <div class="ib-label">Ingredients</div>
      <ul class="ib-list">${ingHtml}</ul>
    </div>`;

  // 3) Names-only copy list (shopping)
  const items = r.pantry.join(", ");
  const copyBlock = `
    <div class="copy-block">
      <div class="cb-label">Shopping list — find these at ${ICC}</div>
      <div class="cb-items" id="items-${key}">${items}</div>
      <button onclick="copyList('${key}', this)">⧉ Copy list</button>
    </div>`;

  // 4) Audio player (or coming-soon note)
  let player;
  if(r.audio){
    player = `
      <div class="voice-player">
        <div class="vp-row">
          <button class="vp-play" id="vpPlay" aria-label="Play narration">▶</button>
          <div class="vp-meta">
            <div class="vp-name">Tara walks you through it</div>
            <div class="vp-time"><span id="vpCur">0:00</span> / <span id="vpDur">0:00</span></div>
          </div>
        </div>
        <input class="vp-scrub" id="vpScrub" type="range" min="0" max="1000" value="0" aria-label="Scrub narration">
        <audio id="vpAudio" src="${r.audio}" preload="metadata"></audio>
      </div>`;
  } else {
    player = `<div class="voice-missing">Tara's voice for this one is coming soon — follow the written steps below.</div>`;
  }

  // 5) Steps + 6) rate button
  const stepsHtml = r.steps.map(s=> `<li>${cleanStep(s)}</li>`).join("");
  const safeRecipe = r.name.replace(/'/g, "\\'");
  const safeMix = r.mix.name.replace(/'/g, "\\'");

  const panel = `
    <div class="recipe-panel">
      <div class="rp-head">
        <h2>${r.name}</h2>
        <p>Her voice, your kitchen</p>
      </div>
      <div class="rp-body">
        ${player}
        <div class="rp-divider"></div>
        <div class="rp-section-label">Method</div>
        <ol class="rp-steps">${stepsHtml}</ol>
        <button class="rate-mix-btn" onclick="openRatingPopup('${safeRecipe}', '${safeMix}')">
          ★ Rate the ${r.mix.name}
        </button>
      </div>
    </div>`;

  botSay(
    `<p>${r.tagline}</p>${productCard}${ingredientsBlock}${copyBlock}`,
    { delay: 700, after: ()=>{
        botSay(`<p>Here's the whole thing. Press play and cook along at your own pace — and rate the mix whenever you like.</p>`, {
          delay: 600, after: ()=> botSay(panel, { delay: 550, after: ()=>{
            wireAudioPlayer();
            setChips(["I'm done!","Pick something else"]);
          }})
        });
    }}
  );
}

/* Strip the guided "Say 'next'" phrasing so the recipe reads cleanly */
function cleanStep(s){
  return s
    .replace(/\s*Say ['‘]next['’][^.]*\.?\s*$/i, "")
    .replace(/\s*Say ['‘]next['’] when[^.]*\.?\s*$/i, "")
    .trim();
}

function copyList(key, btn){
  const text = RECIPES[key].pantry.join(", ");
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent = "✓ Copied";
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = "⧉ Copy list"; btn.classList.remove('copied'); }, 1800);
  }).catch(()=>{ btn.textContent = "Press to select"; });
}



function wireAudioPlayer(){
  const audio = document.getElementById('vpAudio');
  if(!audio) return;
  const play = document.getElementById('vpPlay');
  const scrub = document.getElementById('vpScrub');
  const cur = document.getElementById('vpCur');
  const dur = document.getElementById('vpDur');
  const fmt = s => { s=Math.floor(s||0); return Math.floor(s/60)+":"+String(s%60).padStart(2,'0'); };

  audio.addEventListener('loadedmetadata', ()=>{ dur.textContent = fmt(audio.duration); });
  play.onclick = ()=>{
    if(audio.paused){ audio.play(); play.textContent="❚❚"; }
    else { audio.pause(); play.textContent="▶"; }
  };
  audio.addEventListener('timeupdate', ()=>{
    cur.textContent = fmt(audio.currentTime);
    if(audio.duration) scrub.value = Math.round(audio.currentTime/audio.duration*1000);
  });
  audio.addEventListener('ended', ()=>{ play.textContent="▶"; scrub.value=0; });
  scrub.oninput = ()=>{ if(audio.duration) audio.currentTime = scrub.value/1000*audio.duration; };
}

function finishCooking(){
  const audio = document.getElementById('vpAudio'); if(audio) audio.pause();
  const r = RECIPES[state.recipe];
  const finishedRecipe = r.name;
  botSay(`<p>And that's it — you just made ${finishedRecipe} from scratch. Smells like home, doesn't it?</p>`, {
    after: ()=> botSay(`<p>If it turned out good, send this to someone who'd love it — I'll happily teach them too. Want to cook something else?</p>`,
      { delay: 700, after: ()=>{ state.mode='discovery'; state.recipe=null; setChips(["Show me another recipe","Share this"]); } })
  });
}

/* ============================================================
   SPICE-MIX SATISFACTION RATING — popup + send to Google Sheet
   ============================================================ */
// TODO(go-live): paste your Apps Script web-app URL here to send real data.
const RATING_ENDPOINT = "https://script.google.com/macros/s/AKfycbxpgJGFpSuUKMyWBeKvIgCoWCWzzJmc_glo9AkxINNGFQjHfA5L2e6oSR4plJuLxvcfgA/exec"; // live Google Sheet web app

function openRatingPopup(recipeName, mixName){
  if(document.getElementById('ratingOverlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'ratingOverlay';
  overlay.className = 'rating-overlay';
  overlay.innerHTML = `
    <div class="rating-card" role="dialog" aria-label="Rate the spice mix">
      <button class="rating-close" aria-label="Close" onclick="closeRating()">×</button>
      <div class="rating-mix-label">How happy are you with</div>
      <div class="rating-mix-name">${mixName}?</div>
      <div class="rating-stars" id="ratingStars">
        ${[1,2,3,4,5].map(n=>`<button class="star" data-v="${n}" aria-label="${n} star${n>1?'s':''}">★</button>`).join("")}
      </div>
      <div class="rating-hint" id="ratingHint">Tap a star</div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('show'));

  const stars = overlay.querySelectorAll('.star');
  const hint = overlay.querySelector('#ratingHint');
  const labels = {1:"Not for me",2:"It was okay",3:"Pretty good",4:"Really liked it",5:"Loved it"};
  let chosen = 0;
  const paint = v => stars.forEach(s=> s.classList.toggle('lit', +s.dataset.v <= v));
  stars.forEach(s=>{
    s.onmouseenter = ()=> paint(+s.dataset.v);
    s.onmouseleave = ()=> paint(chosen);
    s.onclick = ()=>{
      chosen = +s.dataset.v; paint(chosen);
      hint.textContent = labels[chosen];
      setTimeout(()=> submitRating(recipeName, mixName, chosen), 450);
    };
  });
}

function closeRating(){
  const o = document.getElementById('ratingOverlay');
  if(!o) return;
  o.classList.remove('show');
  setTimeout(()=>{
    o.remove();
    // restore chips appropriate to where they are
    if(state.mode === 'recipe') setChips(["I'm done!","Pick something else"]);
    else setChips(["Show me another recipe","Share this"]);
  }, 220);
}

function submitRating(recipeName, mixName, stars){
  const payload = { ts: new Date().toISOString(), recipe: recipeName, mix: mixName, rating: stars };

  if(!RATING_ENDPOINT){
    // MOCK MODE — no network, just log so the flow is testable
    console.log("[MOCK rating — would send to Google Sheet]", payload);
  } else {
    // LIVE — fire-and-forget POST to Apps Script web app
    fetch(RATING_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(e=> console.error("rating send failed", e));
  }

  // thank + close
  const card = document.querySelector('.rating-card');
  if(card){
    card.innerHTML = `<div class="rating-thanks">Thank you — that helps Tara more than you know.</div>`;
  }
  setTimeout(closeRating, 1300);
}

/* ============================================================
   THE BRAIN (MOCK) — swap this for a real API call to go live
   ============================================================ */
function handleUserMessage(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  clearChips();
  const t = text.toLowerCase();

  /* --- Recipe screen (everything on one view) --- */
  if(state.mode === 'recipe'){
    if(/(done|finished|complete|made it|that's it)/.test(t)) return void finishCooking();
    if(/(else|another|different|switch|change|pick|cook something)/.test(t)){
      const a=document.getElementById('vpAudio'); if(a) a.pause();
      state.mode='discovery'; state.recipe=null; return void offerOptions();
    }
    // a question while on the recipe — answer lightly, stay put
    return void botSay(`<p>For this one, stick with the amounts in the ingredients list and you'll be fine. Press play whenever you'd like to hear it again — and tell me when you're <strong>done</strong>.</p>`,
      { after: ()=> setChips(["I'm done!","Pick something else"]) });
  }

  /* --- Discovery mode --- */
  // direct recipe name match
  const key = matchRecipe(t);
  if(key) return void showRecipe(key);

  // never-a-dead-end: dishes we don't own
  const pair = matchPairing(t);
  if(pair) return void handlePairing(pair);

  // greetings / openers
  if(/(^hi|^hey|^hello|what.*(make|cook)|suggest|recommend|hungry|dinner|lunch)/.test(t) || t.length < 4){
    return void offerOptions();
  }

  // out of cuisine
  if(/(burger|pizza|pasta|sushi|taco|sandwich|cake|curry chicken)/.test(t)){
    return void botSay(`<p>That's a little out of my kitchen — I'm all South Indian. But if you want something just as comforting, I've got you. Want a rasam, a sambar, or a tangy kuzhambu?</p>`,
      { after: ()=> setChips(["Rasam","Sambar","Surprise me"]) });
  }

  // fallback — never a dead end
  offerOptions("I might not have that exact one, but here's what I do beautifully:");
}

function offerOptions(lead){
  state.mode = 'discovery';
  const intro = lead || "Depends what you're in the mood for.";
  botSay(`<p>${intro} Something light and brothy like a <strong>rasam</strong>? A hearty <strong>sambar</strong>? Or a thick, tangy <strong>vatha kuzhambu</strong> that keeps all week?</p>`,
    { after: ()=> setChips(["Tomato Rasam","Onion Sambar","Surprise me"]) });
}

function matchRecipe(t){
  if(/pepper rasam|milagu/.test(t)) return 'pepper_rasam';
  if(/lemon rasam/.test(t)) return 'lemon_rasam';
  if(/tomato rasam/.test(t)) return 'tomato_rasam';
  if(/onion sambar|sambar/.test(t) && !/vatha|kuzhambu/.test(t)) return 'onion_sambar';
  if(/garlic.*(vatha|kuzhambu)|garlic kuzhambu/.test(t)) return 'garlic_vatha_kuzhambu';
  if(/onion.*(vatha|kuzhambu)|vatha kuzhambu|vathakuzhambu/.test(t)) return 'onion_vatha_kuzhambu';
  if(/^rasam$/.test(t.trim()) || /just rasam|a rasam|some rasam/.test(t)) return 'tomato_rasam';
  if(/surprise|anything|you (pick|choose|decide)/.test(t)) {
    const keys = Object.keys(RECIPES);
    return keys[Math.floor(Math.random()*keys.length)];
  }
  return null;
}

function matchPairing(t){
  for(const dish in PAIRINGS){ if(t.includes(dish)) return dish; }
  return null;
}

function handlePairing(dish){
  const p = PAIRINGS[dish];
  const already = state.suggested.includes(dish);
  let html = `<p>${dish.charAt(0).toUpperCase()+dish.slice(1)} — lovely choice. That one I'd make the traditional way, and it doesn't even need a Sivan mix to shine.</p>`;
  if(!already){
    state.suggested.push(dish);
    html += `<p>${p.line}</p>
      <div class="product-card">
        <div class="pc-label">Pairs well with</div>
        <div class="pc-name">${p.name}</div>
        <a class="cta" href="${p.url}" target="_blank" rel="noopener">See it on sivanspices.com →</a>
      </div>`;
  }
  botSay(html, { after: ()=> setChips(["Sounds good","Show me a Sivan recipe"]) });
}
